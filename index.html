<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K21-SPMT</title>
    <style>
        /* ======= CSS ĐỊNH DẠNG ======= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
        }

        /* Container chứa 2 nút */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        /* Nút bấm to */
        .btn {
            background-color: #ffffff;
            color: #333333;
            font-size: 20px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #f1f1f1;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Lớp phủ Popup nền đen mờ */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            
            /* Ẩn popup mặc định */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Nội dung Popup */
        .popup-content {
            background-color: white;
            padding: 40px 30px 30px 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            position: relative;
            
            /* Hiệu ứng thu phóng khi mở popup */
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        /* Class thêm vào khi mở Popup */
        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        /* Nút đóng (X) */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ff0000;
        }

        /* Container chứa 2 ảnh */
        .image-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; /* Tự xuống dòng trên điện thoại */
        }

        .image-container img {
            max-width: 100%;
            width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- KHU VỰC 2 NÚT BẤM -->
    <div class="btn-container">
        <button class="btn" onclick="openPopup('popup-dang')">Biết anh Dương Nguyễn Hoài Đăng K21B-SPMT không?</button>
        <button class="btn" onclick="openPopup('popup-truc')">Biết Phạm Văn Trung Trực K21G-SPMT không?</button>
    </div>

    <!-- POPUP CỦA ANH ĐĂNG -->
    <div class="popup-overlay" id="popup-dang" onclick="closePopupOutside(event, 'popup-dang')">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup('popup-dang')">&times;</span>
            <div class="image-container">
                <!-- Đã sửa lại tên file ảnh không dấu -->
                <img src="anh-dang.jpg" alt="Ảnh anh Đăng 1">
                <img src="anh-dang.jpg" alt="Ảnh anh Đăng 2">
            </div>
        </div>
    </div>

    <!-- POPUP CỦA TRỰC -->
    <div class="popup-overlay" id="popup-truc" onclick="closePopupOutside(event, 'popup-truc')">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup('popup-truc')">&times;</span>
            <div class="image-container">
                <!-- Đã sửa lại tên file ảnh không dấu -->
                <img src="anh-truc.jpg" alt="Ảnh Trực 1">
                <img src="anh-truc.jpg" alt="Ảnh Trực 2">
            </div>
        </div>
    </div>

    <!-- ======= JAVASCRIPT (SCRIPT) ======= -->
    <script>
        // Hàm mở popup
        function openPopup(popupId) {
            document.getElementById(popupId).classList.add('active');
        }

        // Hàm đóng popup khi ấn nút X
        function closePopup(popupId) {
            document.getElementById(popupId).classList.remove('active');
        }

        // Hàm đóng popup khi click ra ngoài khoảng trắng
        function closePopupOutside(event, popupId) {
            if (event.target.id === popupId) {
                closePopup(popupId);
            }
        }
    </script>
</body>
</html>
